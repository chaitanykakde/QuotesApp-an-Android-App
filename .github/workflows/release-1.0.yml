name: Build Release 1.0

on:
  push:
    tags:
      - 'v1.0.0'
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Copy and checksum APK
        run: |
          mkdir -p release/1.0
          cp app/build/outputs/apk/release/app-release-unsigned.apk release/1.0/quotesapp-1.0.0-unsigned.apk
          sha256sum release/1.0/quotesapp-1.0.0-unsigned.apk > release/1.0/quotesapp-1.0.0-unsigned.apk.sha256

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: quotesapp-1.0.0-unsigned
          path: release/1.0/*

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v1.0.0')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/1.0/quotesapp-1.0.0-unsigned.apk
            release/1.0/quotesapp-1.0.0-unsigned.apk.sha256
          generate_release_notes: true
